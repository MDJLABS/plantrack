# Fichier de capacite unique du serveur (d266, etape 1 de la piste A du rapport Fable).
# Lu par : l'orchestre (EnvironmentFile du service), menage-serveur.sh, kvm-lourd, le gardien.
# Format CLE=valeur, valeurs entre guillemets si elles contiennent des espaces.
# Pas de commentaire en fin de ligne : systemd (EnvironmentFile) les garderait dans la valeur.
# Installe en /etc/plantrack/capacite.conf par installer.sh.

# Machine
VCPU=4
RAM_GO=15

# Interrupteurs (0 = retour au comportement d'avant, lot par lot)
# seul l'orchestre ecrit a Mariella
ALERTES_UNIQUES=1
# kvm-lourd retient aussi les taches des agents (rouge, grosses a l'orange)
GUICHET_AGENT=1

# Guichet kvm-lourd
# a l'orange, seules partent les taches estimees sous ce pic
PETITE_TACHE_MO=1024

# Alertes de l'orchestre (4 cas de panne)
# rouge continu depuis 30 min
ORCH_ALERTE_DELAI=1800
DISQUE_ALERTE_PCT=90
SERVICES_SOCLE="bcc.service bcc-proxy.service cloudflared.service caddy.service docker.service tailscaled.service earlyoom.service"
# orchestre sans mesure depuis 10 min
GARDIEN_MUET_S=600
